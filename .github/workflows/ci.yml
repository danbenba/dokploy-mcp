name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_KEY: ci_app_key_used_only_for_the_test_suite
  TOKEN_SECRET: ci_token_secret_used_only_for_the_test_suite_padding
  NODE_ENV: test
  PORT: 3333
  HOST: localhost
  LOG_LEVEL: silent
  PUBLIC_URL: http://localhost:3333
  WEB_URL: http://localhost:5173

jobs:
  core:
    name: core package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w packages/core
      - run: npm run build -w packages/core
      - uses: actions/upload-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
          retention-days: 1

  api:
    name: api server
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - run: npm run typecheck -w apps/api
      - run: npm run test -w apps/api
      - run: npm run build -w apps/api

  cli:
    name: cli package
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: core-dist
          path: packages/core/dist
      - run: npm run typecheck -w apps/cli
      - run: npm run test -w apps/cli
      - run: npm run build -w apps/cli
      - run: node apps/cli/dist/cli.js --version

  web:
    name: web ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web

  images:
    name: docker images
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
      - name: build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
