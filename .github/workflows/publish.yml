name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: publish dokploy-rest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build -w packages/core
      - run: npm run typecheck -w apps/cli
      - run: npm run test -w apps/cli
      - run: npm run build -w apps/cli
      - run: node apps/cli/dist/cli.js --version
      - run: npm publish -w apps/cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
