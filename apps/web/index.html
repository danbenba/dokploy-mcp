<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/dokploy.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <title>Dokploy MCP — Let Claude run your Dokploy panel</title>
    <meta
      name="description"
      content="Open-source MCP server that lets Claude, ChatGPT, Cursor or VS Code deploy, debug and manage your self-hosted Dokploy panel. Hosted connector or npx dokploy-rest."
    />
    <meta
      name="keywords"
      content="dokploy mcp, dokploy, mcp server, model context protocol, claude connector, chatgpt connector, cursor mcp, vs code mcp, dokploy-rest, devops, paas, docker, traefik"
    />
    <link rel="canonical" href="https://dokploy.rest/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dokploy MCP" />
    <meta property="og:title" content="Dokploy MCP — Let Claude run your Dokploy panel" />
    <meta
      property="og:description"
      content="Connect Claude or ChatGPT to the Dokploy instance you already host. Ask for a deployment, a database or the reason a build failed, in your own words."
    />
    <meta property="og:url" content="https://dokploy.rest/" />
    <meta property="og:image" content="https://dokploy.rest/dokploy.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Dokploy MCP — Let Claude run your Dokploy panel" />
    <meta
      name="twitter:description"
      content="Open-source MCP server for Dokploy. Hosted connector at mcp.dokploy.rest or npx -y dokploy-rest."
    />
    <meta name="twitter:image" content="https://dokploy.rest/dokploy.svg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Dokploy MCP",
        "alternateName": "dokploy-rest",
        "url": "https://dokploy.rest",
        "description": "Open-source Model Context Protocol server connecting Claude and ChatGPT to a self-hosted Dokploy panel.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Dany (danbenba)", "url": "https://github.com/danbenba" },
        "sameAs": [
          "https://github.com/danbenba/dokploy-mcp",
          "https://www.npmjs.com/package/dokploy-rest"
        ]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Does the connector store my Dokploy password?",
            "acceptedAnswer": { "@type": "Answer", "text": "No. Your password is sent once to the panel you named, exchanged for an API key created on that panel, and never kept. Tokens are encrypted and carry the connection themselves; there is no database." }
          },
          {
            "@type": "Question",
            "name": "Which assistants and editors are supported?",
            "acceptedAnswer": { "@type": "Answer", "text": "Any client that speaks the Model Context Protocol. The hosted connector works with Claude and ChatGPT. The npm package works with Claude Code, Claude Desktop, Cursor, Windsurf, VS Code, Zed and other stdio clients." }
          },
          {
            "@type": "Question",
            "name": "Can I limit what the assistant is allowed to do?",
            "acceptedAnswer": { "@type": "Answer", "text": "Yes. Permissions are chosen when you connect: read, deploy, create, delete and full API access. Destructive tools also require an explicit confirmation." }
          },
          {
            "@type": "Question",
            "name": "How do I revoke access?",
            "acceptedAnswer": { "@type": "Answer", "text": "Delete the API key in your Dokploy panel under Settings, then API Keys. The connection stops working immediately." }
          },
          {
            "@type": "Question",
            "name": "Is it affiliated with Dokploy?",
            "acceptedAnswer": { "@type": "Answer", "text": "No. Dokploy MCP is an independent, open-source integration released under the Apache 2.0 license. Dokploy is made by Dokploy Technology, Inc." }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
